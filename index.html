<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mouse PWA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #080e14;
            color: #00ffcc;
            font-family: system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
            overflow: hidden;
        }
        #status {
            text-align: center;
            font-weight: bold;
            font-size: 0.75rem;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .top-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        .quick-bar {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }
        button {
            background: #0f1923;
            border: 1px solid #1c2a38;
            color: #00ffcc;
            padding: 10px 2px;
            border-radius: 8px;
            font-size: 0.65rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        #btn-sleep {
            color: #ff0055;
            border-color: #ff0055;
        }
        button:active, button.active {
            background: #00ffcc;
            color: #080e14;
        }
        #touchpad {
            flex: 1;
            background: #0b141d;
            border: 1px solid #1c2a38;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #00ffcc;
            font-size: 0.7rem;
            text-align: center;
            touch-action: none;
            margin-bottom: 10px;
            gap: 8px;
            opacity: 0.8;
        }
        .mouse-icon {
            width: 24px;
            height: 36px;
            border: 2px solid #00ffcc;
            border-radius: 12px;
            position: relative;
        }
        .mouse-icon::after {
            content: '';
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 6px;
            background: #00ffcc;
        }
        .bottom-controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .media-bar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }
        .mouse-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            height: 42px;
        }
        #hidden-input {
            position: absolute;
            opacity: 0;
            top: -1000px;
        }
    </style>
</head>
<body>

    <div id="status">CONECTANDO...</div>

    <div class="top-row">
        <button id="btn-drag"><span id="lock-icon">🔒</span> ARRASTRAR</button>
        <button id="btn-keyboard">⌨️ TECLADO</button>
    </div>

    <div class="quick-bar">
        <button id="btn-copy">COPY</button>
        <button id="btn-paste">PASTE</button>
        <button id="btn-tab">ALT+TAB</button>
        <button id="btn-desk">DESK</button>
        <button id="btn-full">FULL</button>
        <button id="btn-sleep">SUSPEND</button>
    </div>

    <div id="touchpad">
        <div class="mouse-icon"></div>
        <div>PANEL TÁCTIL (ZOOM HABILITADO)</div>
    </div>

    <div class="bottom-controls">
        <div class="media-bar">
            <button id="btn-prev">⏮️</button>
            <button id="btn-rewind">⏪</button>
            <button id="btn-voldown">🔉</button>
            <button id="btn-play">⏯️</button>
            <button id="btn-volup">🔊</button>
            <button id="btn-forward">⏩</button>
            <button id="btn-next">⏭️</button>
        </div>
        <div class="mouse-buttons">
            <button id="btn-left">CLIC IZQ</button>
            <button id="btn-right">CLIC DER</button>
        </div>
    </div>

    <input type="text" id="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="none">

    <script>
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const statusDiv = document.getElementById("status");
        let ws = null;

        function conectar() {
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/mouse`);

            ws.onopen = () => {
                if (statusDiv) {
                    statusDiv.textContent = "CONECTADO";
                    statusDiv.style.color = "#00ffcc";
                }
            };

            ws.onclose = () => {
                if (statusDiv) {
                    statusDiv.textContent = "RECONECTANDO...";
                    statusDiv.style.color = "#ff0055";
                }
                setTimeout(conectar, 2000);
            };

            ws.onerror = () => {
                ws.close();
            };
        }
        conectar();

        const touchpad = document.getElementById("touchpad");
        const hiddenInput = document.getElementById("hidden-input");

        const vibrate = () => { if (navigator.vibrate) navigator.vibrate(15); };

        let lastX = 0, lastY = 0, lastSendTime = 0, isDragging = false;
        let touchStartTime = 0, touchMoved = false;
        let lastTapTime = 0;
        let initialPinchDistance = null;
        const SEND_INTERVAL = 16, sensitivity = 1.4;

        const getDistance = (t1, t2) => {
            const dx = t1.clientX - t2.clientX;
            const dy = t1.clientY - t2.clientY;
            return Math.sqrt(dx * dx + dy * dy);
        };

        touchpad.addEventListener("touchstart", (e) => {
            touchStartTime = Date.now();
            touchMoved = false;
            if (e.touches.length === 1) {
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                lastY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                initialPinchDistance = getDistance(e.touches[0], e.touches[1]);
            }
        });

        touchpad.addEventListener("touchmove", (e) => {
            e.preventDefault();
            touchMoved = true;
            const now = Date.now();
            if (now - lastSendTime < SEND_INTERVAL) return;
            lastSendTime = now;

            if (e.touches.length === 1) {
                const touch = e.touches[0];
                const dx = (touch.clientX - lastX) * sensitivity;
                const dy = (touch.clientY - lastY) * sensitivity;
                lastX = touch.clientX; lastY = touch.clientY;
                if (Math.abs(dx) > 0.1 || Math.abs(dy) > 0.1) {
                    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "move", dx: Math.round(dx), dy: Math.round(dy) }));
                }
            } else if (e.touches.length === 2) {
                const currentDistance = getDistance(e.touches[0], e.touches[1]);
                const diff = currentDistance - initialPinchDistance;

                if (Math.abs(diff) > 20) {
                    const zoomDirection = diff > 0 ? "in" : "out";
                    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "zoom", direction: zoomDirection }));
                    initialPinchDistance = currentDistance;
                } else {
                    const currentY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                    const dy = currentY - lastY;
                    lastY = currentY;
                    if (Math.abs(dy) > 2) {
                        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "scroll", clicks: Math.round(-dy * 2) }));
                    }
                }
            }
        }, { passive: false });

        touchpad.addEventListener("touchend", (e) => {
            if (e.touches.length < 2) {
                initialPinchDistance = null;
            }
            const touchDuration = Date.now() - touchStartTime;
            if (!touchMoved && touchDuration < 250 && e.touches.length === 0) {
                const now = Date.now();
                if (now - lastTapTime < 300) {
                    vibrate();
                    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "click", button: "left", clicks: 2 }));
                    lastTapTime = 0;
                } else {
                    vibrate();
                    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "click", button: "left", clicks: 1 }));
                    lastTapTime = now;
                }
            }
        });

        document.getElementById("btn-left").onclick = () => { vibrate(); if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "click", button: "left" })); };
        document.getElementById("btn-right").onclick = () => { vibrate(); if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "click", button: "right" })); };

        const dragBtn = document.getElementById("btn-drag");
        dragBtn.onclick = () => {
            vibrate();
            isDragging = !isDragging;
            dragBtn.classList.toggle("active", isDragging);
            if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: isDragging ? "drag_start" : "drag_end" }));
        };

        document.getElementById("btn-keyboard").onclick = () => { vibrate(); hiddenInput.focus(); };

        hiddenInput.addEventListener("keydown", (e) => {
            if (e.key === "Backspace") if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "key", key: "backspace" }));
        });

        hiddenInput.addEventListener("input", (e) => {
            if (e.data) if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "text", text: e.data }));
            hiddenInput.value = "";
        });

        document.getElementById("btn-copy").onclick = () => { vibrate(); if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "hotkey", keys: ["ctrl", "c"] })); };
        document.getElementById("btn-paste").onclick = () => { vibrate(); if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "hotkey", keys: ["ctrl", "v"] })); };
        document.getElementById("btn-tab").onclick = () => { vibrate(); if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "hotkey", keys: ["alt", "tab"] })); };
        document.getElementById("btn-desk").onclick = () => { vibrate(); if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "hotkey", keys: ["win", "d"] })); };
        document.getElementById("btn-full").onclick = () => { vibrate(); if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "key", key: "f11" })); };
        document.getElementById("btn-sleep").onclick = () => {
            vibrate();
            if (confirm("¿Suspender la PC, mi amor?")) {
                if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "system", cmd: "sleep" }));
            }
        };

        document.getElementById("btn-prev").onclick = () => { vibrate(); if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "key", key: "prevtrack" })); };
        document.getElementById("btn-rewind").onclick = () => { vibrate(); if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "key", key: "left" })); };
        document.getElementById("btn-voldown").onclick = () => { vibrate(); if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "key", key: "volumedown" })); };
        document.getElementById("btn-play").onclick = () => { vibrate(); if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "key", key: "playpause" })); };
        document.getElementById("btn-volup").onclick = () => { vibrate(); if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "key", key: "volumeup" })); };
        document.getElementById("btn-forward").onclick = () => { vibrate(); if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "key", key: "right" })); };
        document.getElementById("btn-next").onclick = () => { vibrate(); if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "key", key: "nexttrack" })); };
    </script>
</body>
</html>
