<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="manifest" href="/manifest.json">
    <title>Mouse PWA Cyberpunk</title>
    <style>
        * { box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; }
        body { margin: 0; padding: 0; background-color: #0b0e14; color: #00ffcc; font-family: system-ui, sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        #status { padding: 4px; text-align: center; font-size: 10px; font-weight: bold; background-color: #121824; color: #ff0055; border-bottom: 1px solid #1a2332; }
        .toolbar { display: flex; gap: 6px; padding: 6px 8px; background: #0f1522; }
        .toolbar button { flex: 1; padding: 8px 4px; font-size: 11px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        #touchpad { flex: 1; background: radial-gradient(circle, #161f30 0%, #0f1522 100%); margin: 6px 8px; border-radius: 14px; border: 2px solid #00ffcc33; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #00ffcc55; font-size: 11px; letter-spacing: 1px; }
        .mouse-icon { width: 32px; height: 48px; border: 2px solid #00ffcc55; border-radius: 16px; position: relative; margin-bottom: 4px; }
        .mouse-wheel { width: 4px; height: 8px; background-color: #00ffcc88; border-radius: 2px; position: absolute; top: 6px; left: 50%; transform: translateX(-50%); }
        .media-bar { display: flex; gap: 4px; padding: 0 8px 6px 8px; }
        .media-bar button { flex: 1; padding: 8px 2px; background: #161f30; display: flex; align-items: center; justify-content: center; }
        .controls { display: flex; padding: 0 8px calc(6px + env(safe-area-inset-bottom)) 8px; gap: 6px; }
        button { flex: 1; padding: 10px; font-size: 11px; font-weight: bold; background: #121824; color: #00ffcc; border: 1px solid #00ffcc55; border-radius: 8px; cursor: pointer; fill: #00ffcc; }
        button:active, button.active { background-color: #00ffcc; color: #0b0e14; fill: #0b0e14; box-shadow: 0 0 12px #00ffcc; }
        svg { width: 15px; height: 15px; }
        #hidden-input { position: absolute; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div id="status">CONECTANDO...</div>
    <div class="toolbar">
        <button id="btn-drag">
            <svg id="lock-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            <span id="drag-text">ARRASTRAR</span>
        </button>
        <button id="btn-keyboard">
            <svg viewBox="0 0 24 24"><path d="M20 5H4c-1.1 0-1.99.9-1.99 2L2 17c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zm-3 0h2v2H5v-2zm0-3h2v2H5V8zm11 10H8v-2h8v2zm1-3h-2v-2h2v2zm0-3h-2V8h2v2zm3 3h-2v-2h2v2zm0-3h-2V8h2v2z"/></svg>
            TECLADO
        </button>
    </div>
    <div id="touchpad">
        <div class="mouse-icon"><div class="mouse-wheel"></div></div>
        <span>PANEL TÁCTIL</span>
    </div>
    <div class="media-bar">
        <button id="btn-prev" title="Video Anterior">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="btn-rewind" title="Rebobinar">
            <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
        </button>
        <button id="btn-voldown" title="Volumen -">
            <svg viewBox="0 0 24 24"><path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/></svg>
        </button>
        <button id="btn-play" title="Play/Pausa">
            <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button id="btn-volup" title="Volumen +">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </button>
        <button id="btn-forward" title="Adelantar">
            <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
        </button>
        <button id="btn-next" title="Siguiente Video">
            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
    </div>
    <div class="controls">
        <button id="btn-left">CLIC IZQ</button>
        <button id="btn-right">CLIC DER</button>
    </div>
    <input type="text" id="hidden-input">
    <script>
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${protocol}//${window.location.host}/ws/mouse`);
        const statusDiv = document.getElementById("status");
        const touchpad = document.getElementById("touchpad");
        const hiddenInput = document.getElementById("hidden-input");

        const vibrate = () => { if (navigator.vibrate) navigator.vibrate(15); };

        ws.onopen = () => { statusDiv.textContent = "● CONECTADO"; statusDiv.style.color = "#00ffcc"; };
        ws.onclose = () => { statusDiv.textContent = "○ DESCONECTADO"; statusDiv.style.color = "#ff0055"; };

        let lastX = 0, lastY = 0, lastSendTime = 0, isDragging = false;
        let touchStartTime = 0, touchMoved = false;
        let lastTapTime = 0;
        const SEND_INTERVAL = 16, sensitivity = 1.4;

        touchpad.addEventListener("touchstart", (e) => {
            touchStartTime = Date.now();
            touchMoved = false;
            if (e.touches.length === 1) {
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                lastY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
            }
        });

        touchpad.addEventListener("touchmove", (e) => {
            e.preventDefault();
            touchMoved = true;
            const now = Date.now();
            if (now - lastSendTime < SEND_INTERVAL) return;
            lastSendTime = now;

            if (e.touches.length === 1) {
                const touch = e.touches[0];
                const dx = (touch.clientX - lastX) * sensitivity;
                const dy = (touch.clientY - lastY) * sensitivity;
                lastX = touch.clientX; lastY = touch.clientY;
                if (Math.abs(dx) > 0.1 || Math.abs(dy) > 0.1) {
                    ws.send(JSON.stringify({ type: "move", dx: Math.round(dx), dy: Math.round(dy) }));
                }
            } else if (e.touches.length === 2) {
                const currentY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                const dy = currentY - lastY;
                lastY = currentY;
                if (Math.abs(dy) > 2) {
                    // Scroll invertido natural para pantalla táctil
                    ws.send(JSON.stringify({ type: "scroll", clicks: Math.round(-dy * 2) }));
                }
            }
        }, { passive: false });

        touchpad.addEventListener("touchend", (e) => {
            const touchDuration = Date.now() - touchStartTime;
            if (!touchMoved && touchDuration < 250 && e.touches.length === 0) {
                const now = Date.now();
                if (now - lastTapTime < 300) {
                    // Doble Tap -> Doble Clic Izquierdo
                    vibrate();
                    ws.send(JSON.stringify({ type: "click", button: "left", clicks: 2 }));
                    lastTapTime = 0;
                } else {
                    // Tap Simple -> Clic Izquierdo
                    vibrate();
                    ws.send(JSON.stringify({ type: "click", button: "left", clicks: 1 }));
                    lastTapTime = now;
                }
            }
        });

        document.getElementById("btn-left").onclick = () => { vibrate(); ws.send(JSON.stringify({ type: "click", button: "left" })); };
        document.getElementById("btn-right").onclick = () => { vibrate(); ws.send(JSON.stringify({ type: "click", button: "right" })); };

        const dragBtn = document.getElementById("btn-drag");
        const lockIcon = document.getElementById("lock-icon");
        dragBtn.onclick = () => {
            vibrate();
            isDragging = !isDragging;
            dragBtn.classList.toggle("active", isDragging);
            lockIcon.innerHTML = isDragging 
                ? `<path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6h1.9c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm0 12H6V10h12v10z"/>`
                : `<path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>`;
            ws.send(JSON.stringify({ type: isDragging ? "drag_start" : "drag_end" }));
        };

        document.getElementById("btn-keyboard").onclick = () => { vibrate(); hiddenInput.focus(); };
        
        hiddenInput.addEventListener("keydown", (e) => {
            if (e.key === "Backspace") {
                ws.send(JSON.stringify({ type: "key", key: "backspace" }));
            }
        });

        hiddenInput.addEventListener("input", (e) => {
            if (e.data) ws.send(JSON.stringify({ type: "text", text: e.data }));
            hiddenInput.value = "";
        });

        document.getElementById("btn-prev").onclick = () => { vibrate(); ws.send(JSON.stringify({ type: "key", key: "prevtrack" })); };
        document.getElementById("btn-rewind").onclick = () => { vibrate(); ws.send(JSON.stringify({ type: "key", key: "left" })); };
        document.getElementById("btn-voldown").onclick = () => { vibrate(); ws.send(JSON.stringify({ type: "key", key: "volumedown" })); };
        document.getElementById("btn-play").onclick = () => { vibrate(); ws.send(JSON.stringify({ type: "key", key: "playpause" })); };
        document.getElementById("btn-volup").onclick = () => { vibrate(); ws.send(JSON.stringify({ type: "key", key: "volumeup" })); };
        document.getElementById("btn-forward").onclick = () => { vibrate(); ws.send(JSON.stringify({ type: "key", key: "right" })); };
        document.getElementById("btn-next").onclick = () => { vibrate(); ws.send(JSON.stringify({ type: "key", key: "nexttrack" })); };
    </script>
</body>
</html>
