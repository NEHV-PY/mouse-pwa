<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d0d0d">
    <title>Mouse Táctil PWA</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
        }
        body {
            margin: 0;
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #estado {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #ff4444;
            z-index: 5;
        }
        #top-bar {
            position: absolute;
            top: 10px;
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        .btn-top {
            background-color: #1c1c1e;
            color: #fff;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
        .btn-top:active {
            transform: scale(0.95);
        }
        #btn-drag.activo {
            background-color: #ff9500;
            border-color: #ff9500;
            color: #000;
            font-weight: bold;
        }
        #touchpad {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            border: 2px dashed #2a2a2a;
            margin: 65px 10px 10px 10px;
            border-radius: 12px;
            color: #666;
            font-size: 1rem;
            text-align: center;
            padding: 20px;
            z-index: 1;
        }
        #botones {
            display: flex;
            height: 70px;
            margin: 0 10px 10px 10px;
            gap: 10px;
            z-index: 5;
        }
        .btn {
            flex: 1;
            background-color: #1c1c1e;
            border: 1px solid #333;
            border-radius: 8px;
            color: #aaa;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        .btn:active {
            background-color: #007aff;
            color: #fff;
        }
        #input-remoto {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div id="estado">(Conectando...)</div>

    <div id="top-bar">
        <button id="btn-drag" class="btn-top">🔓 Mover</button>
        <button id="btn-teclado" class="btn-top">⌨️</button>
    </div>
    
    <input type="text" id="input-remoto" autocomplete="off" />

    <div id="touchpad">Desliza (1 dedo)<br>Scroll (2 dedos)<br>Háptico Reforzado 📳</div>
    
    <div id="botones">
        <div id="btn-izq" class="btn">Clic Izq</div>
        <div id="btn-der" class="btn">Clic Der</div>
    </div>

    <script>
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const socket = new WebSocket(`${wsProtocol}//${window.location.host}/ws/mouse`);

        const estadoDiv = document.getElementById('estado');
        const inputRemoto = document.getElementById('input-remoto');
        const btnTeclado = document.getElementById('btn-teclado');
        const btnDrag = document.getElementById('btn-drag');

        let modo_enganchado = false;

        function vibrar(patron) {
            if ("vibrate" in navigator) {
                try {
                    navigator.vibrate(patron);
                } catch (e) {
                    console.log("Vibración bloqueada:", e);
                }
            }
        }

        // PATRONES REFORZADOS
        const haptico = {
            agarre: () => vibrar([80, 40, 100]), // Enganche doble, firme y marcado
            suelte: () => vibrar(90),            // Pulso seco de 90ms para garantizar lectura
            clic: () => vibrar(50),              // Clic definido
            tecla: () => vibrar(30)              // Teclado
        };

        socket.onopen = () => {
            estadoDiv.innerText = "(Conectado ✓)";
            estadoDiv.style.color = "#00ff88";
        };

        socket.onerror = () => {
            estadoDiv.innerText = "(Error)";
            estadoDiv.style.color = "#ff4444";
        };

        socket.onclose = () => {
            estadoDiv.innerText = "(Desconectado)";
            estadoDiv.style.color = "#ff4444";
        };

        btnTeclado.addEventListener('click', (e) => {
            e.preventDefault();
            haptico.tecla();
            inputRemoto.focus();
        });

        // CONTROL DE AGARRE Y SOLTAR CON VIBRACIÓN GARANTIZADA
        btnDrag.addEventListener('click', (e) => {
            e.preventDefault();
            modo_enganchado = !modo_enganchado;

            if (socket.readyState === WebSocket.OPEN) {
                if (modo_enganchado) {
                    haptico.agarre(); // Sientes el enganche fuerte
                    socket.send(JSON.stringify({ "type": "down" }));
                    btnDrag.innerText = "🔒 Soltar";
                    btnDrag.classList.add("activo");
                } else {
                    haptico.suelte(); // Sientes claramente cuando suelta
                    socket.send(JSON.stringify({ "type": "up" }));
                    btnDrag.innerText = "🔓 Mover";
                    btnDrag.classList.remove("activo");
                }
            }
        });

        inputRemoto.addEventListener('input', (evento) => {
            if (socket.readyState !== WebSocket.OPEN) return;
            const valor = evento.target.value;
            if (valor.length > 0) {
                haptico.tecla();
                socket.send(JSON.stringify({ "type": "text", "text": valor }));
                inputRemoto.value = "";
            }
        });

        inputRemoto.addEventListener('keydown', (evento) => {
            if (socket.readyState !== WebSocket.OPEN) return;
            if (evento.key === "Backspace") {
                haptico.tecla();
                socket.send(JSON.stringify({ "type": "key", "key": "backspace" }));
            } else if (evento.key === "Enter") {
                haptico.tecla();
                socket.send(JSON.stringify({ "type": "key", "key": "enter" }));
            }
        });

        const sensibilidad = 3.8;
        let ultima_posicion_x = 0;
        let ultima_posicion_y = 0;
        let inicio_movimiento = false;
        let en_proceso_frame = false;

        const zona_tactil = document.getElementById('touchpad');

        zona_tactil.addEventListener('touchstart', (evento) => {
            if (evento.touches.length === 1) {
                ultima_posicion_x = evento.touches[0].clientX;
                ultima_posicion_y = evento.touches[0].clientY;
                inicio_movimiento = false;
            } else if (evento.touches.length === 2) {
                ultima_posicion_y = (evento.touches[0].clientY + evento.touches[1].clientY) / 2;
            }
        });

        zona_tactil.addEventListener('touchmove', (evento) => {
            if (socket.readyState !== WebSocket.OPEN || en_proceso_frame) return;

            en_proceso_frame = true;
            requestAnimationFrame(() => {
                if (evento.touches.length === 1) {
                    inicio_movimiento = true;
                    let pos_x = evento.touches[0].clientX;
                    let pos_y = evento.touches[0].clientY;

                    let delta_x = (pos_x - ultima_posicion_x) * sensibilidad;
                    let delta_y = (pos_y - ultima_posicion_y) * sensibilidad;

                    ultima_posicion_x = pos_x;
                    ultima_posicion_y = pos_y;

                    socket.send(JSON.stringify({ "type": "move", "dx": delta_x, "dy": delta_y }));
                } else if (evento.touches.length === 2) {
                    let pos_y = (evento.touches[0].clientY + evento.touches[1].clientY) / 2;
                    let delta_scroll = (ultima_posicion_y - pos_y) * 2.5;
                    ultima_posicion_y = pos_y;

                    socket.send(JSON.stringify({ "type": "scroll", "dy": delta_scroll }));
                }
                en_proceso_frame = false;
            });
        });

        zona_tactil.addEventListener('touchend', (evento) => {
            if (!inicio_movimiento && evento.touches.length === 0 && socket.readyState === WebSocket.OPEN && !modo_enganchado) {
                haptico.clic();
                socket.send(JSON.stringify({ "type": "click", "button": "left" }));
            }
        });

        document.getElementById('btn-izq').addEventListener('touchstart', (e) => {
            e.preventDefault();
            haptico.clic();
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ "type": "click", "button": "left" }));
            }
        });

        document.getElementById('btn-der').addEventListener('touchstart', (e) => {
            e.preventDefault();
            haptico.clic();
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ "type": "click", "button": "right" }));
            }
        });
    </script>
</body>
</html>
